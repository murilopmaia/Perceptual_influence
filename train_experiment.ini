[Experiment-Management]
mode = train
resume-previous-exp = no
previous-hash = -
last-epoch-executed = -
data-dir = /workspace/dataset/new_images_split

[Train-Setup]
database = new-dataset
negative_values = no
split-hash = 4840
network = unet
patch-size = 96
patch-skip = 96
loss = perceptual
batch = 1
epochs = 10
lr = 1e-3
seed = 5
overwrite-weights-file = yes

[Network-Hyperparameters]
channels = 32

[Perceptual-Loss-Hyperparameters]
image-space-loss = mse
perceptual-space-loss = mse
perceptual-content-layer = block3_conv2
perceptual-weight = 5.75374792e-06
perceptual-model = vgg19-imagenet
weights-path = none
adaptive-lambda = no
target-perceptual-influence = 0.95
